<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>NEONVAULT V2 · Tabungan Cyber</title>
  <meta name="theme-color" content="#050816" />
  <meta name="description" content="Aplikasi tabungan modern dengan desain cyberpunk futuristik" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== LOADING SCREEN ===== -->
  <div id="loadingScreen" class="loading-overlay">
    <div class="loader-ring"></div>
    <div class="loader-text">INISIALISASI NEONVAULT</div>
  </div>

  <!-- ===== ONBOARDING ===== -->
  <div id="onboarding" class="onboarding-overlay">
    <div class="onboarding-content">
      <div class="onboarding-icon">✦</div>
      <h1 class="onboarding-title">NEONVAULT</h1>
      <p class="onboarding-sub">Your Money. Your Goals. Your Future.</p>
      <p class="onboarding-desc">Kelola tabunganmu dengan mudah tanpa login.</p>
      <button id="onboardingStart" class="neon-btn">Mulai</button>
    </div>
  </div>

  <!-- ===== POPUP NAMA ===== -->
  <div id="namePopup" class="popup-overlay">
    <div class="popup-glass">
      <div class="popup-title">✦ SELAMAT DATANG ✦</div>
      <p class="popup-sub">Masukkan nama untuk memulai</p>
      <input type="text" id="nameInput" placeholder="Nama Anda" maxlength="25" autofocus />
      <button id="startBtn" class="neon-btn">Mulai</button>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboard" class="dashboard">
    <header class="glass-header">
      <div class="logo">✦ NEONVAULT</div>
      <div class="header-right">
        <span id="realTimeClock">--:--:--</span>
        <span id="realTimeDate">--</span>
        <button id="settingsToggle" class="icon-btn" aria-label="Pengaturan">⚙️</button>
      </div>
    </header>

    <main class="main-grid" id="mainContent">
      <!-- Content akan di-render oleh JavaScript -->
    </main>
  </div>

  <!-- ===== BOTTOM NAVIGATION ===== -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi Utama">
    <button class="nav-item active" data-page="dashboard" aria-label="Beranda">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Beranda</span>
    </button>
    <button class="nav-item" data-page="goals" aria-label="Target">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">Target</span>
    </button>
    <button class="nav-item" data-page="transactions" aria-label="Transaksi">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Transaksi</span>
    </button>
    <button class="nav-item" data-page="analytics" aria-label="Analitik">
      <span class="nav-icon">📈</span>
      <span class="nav-label">Analitik</span>
    </button>
    <button class="nav-item" data-page="settings" aria-label="Pengaturan">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Pengaturan</span>
    </button>
  </nav>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
